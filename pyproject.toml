[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hunttech-bot-common"
version = "0.5.11"
description = "Shared library for HuntTech Telegram bots"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.0,<4.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
database = ["asyncpg>=0.29"]
documents = ["python-docx>=1.2.0", "pypdf>=6.0.0", "striprtf>=0.0.32"]
test = ["pytest>=7", "pytest-asyncio>=0.21"]
all = ["hunttech-bot-common[database,documents,test]"]

[tool.setuptools.packages.find]
include = ["hunttech_bot_common*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
